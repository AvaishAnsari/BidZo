databases:
  - name: bidzo-db
    databaseName: bidzo
    user: bidzo
    plan: free

services:
  - type: web
    name: bidzo-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && PYTHONPATH=\".:backend\" python backend/manage.py migrate"
    startCommand: "PYTHONPATH=\".:backend\" daphne -b 0.0.0.0 -p $PORT backend.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: bidzo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
